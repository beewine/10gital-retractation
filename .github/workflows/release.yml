name: Publication

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier l'archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du plugin
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 "define( 'RET10G_VERSION'" 10gital-retractation.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à RET10G_VERSION ($version)."
            exit 1
          fi

      - name: Construire l'archive
        run: |
          set -e
          mkdir -p build/10gital-retractation
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'tests' \
            --exclude '.gitignore' \
            --exclude 'CHANGELOG.md' \
            --exclude 'README.md' \
            ./ build/10gital-retractation/
          cd build
          zip -rq 10gital-retractation.zip 10gital-retractation
          unzip -l 10gital-retractation.zip | tail -5

      - name: Extraire les notes de version du CHANGELOG
        id: notes
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "Version $version." > /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Créer la publication
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: build/10gital-retractation.zip
